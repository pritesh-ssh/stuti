<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happyy birthday stutuuu</title>
    <link rel="stylesheet" href="gate.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="gate-wrapper">
        <div class="flag__birthday">
            <img src="./images/1.png" alt="" width="350" class="flag__left">
            <img src="./images/1.png" alt="" width="350" class="flag__right">
        </div>

        <div class="gate-content">
            <h1 class="gate-title">
                <div class="line line--one" id="line__one">
                    <span style="--t: .5s;">N</span>
                    <span style="--t: .65s;">o</span>
                    <span style="--t: .8s;">t</span>
                    <span class="space"></span>
                    <span style="--t: .95s;">Y</span>
                    <span style="--t: 1.1s;">e</span>
                    <span style="--t: 1.25s;">t</span>
                </div>
                <div class="line line--two">
                    <span style="--t: 1.4s;">M</span>
                    <span style="--t: 1.55s;">a</span>
                    <span style="--t: 1.7s;">d</span>
                    <span style="--t: 1.85s;">a</span>
                    <span style="--t: 2s;">m</span>
                    <span class="space"></span>
                    <span style="--t: 2.15s;">j</span>
                    <span style="--t: 2.3s;">i</span>
                </div>
                <div class="hat">
                    <img src="./images/hat.png" alt="" width="130">
                </div>
            </h1>

            <div class="gate-subtitle">
                <i class="fa-solid fa-heart"></i>
                <span id="subtitle__text">Your surprise unlocks in&hellip;</span>
                <i class="fa-solid fa-heart"></i>
            </div>

            <div class="countdown" id="countdown">
                <div class="balloon_one">
                    <img width="100px" src="./images/balloon1.png" alt="">
                </div>
                <div class="unit">
                    <div class="num" id="days">00</div>
                    <div class="label">Days</div>
                </div>
                <div class="unit">
                    <div class="num" id="hours">00</div>
                    <div class="label">Hours</div>
                </div>
                <div class="unit">
                    <div class="num" id="minutes">00</div>
                    <div class="label">Minutes</div>
                </div>
                <div class="unit">
                    <div class="num" id="seconds">00</div>
                    <div class="label">Seconds</div>
                </div>
                <div class="balloon_two">
                    <img width="100px" src="./images/balloon2.png" alt="">
                </div>
            </div>

            <div class="lock__note" id="lock__note">
                <i class="fa-solid fa-lock"></i>
                <span>Come back at 12:00 AM on 20th August &mdash; no peeking!</span>
            </div>

            <div class="unlock" id="unlock">
                <a href="final.html" id="btn__unlock">
                    Open Your Surprise &#127873;
                    <i class="fa-solid fa-gift"></i>
                </a>
            </div>
        </div>

        <div class="decorate_star star1" style="--t: 2.6s;"></div>
        <div class="decorate_star star2" style="--t: 2.8s;"></div>
        <div class="decorate_star star3" style="--t: 3s;"></div>
        <div class="decorate_star star4" style="--t: 3.2s;"></div>
        <div class="decorate_star star5" style="--t: 3.4s;"></div>
        <div class="decorate_flower--one" style="--t: 2.7s;">
            <img width="20" src="./images/decorate_flower.png" alt="">
        </div>
        <div class="decorate_flower--two" style="--t: 3s;">
            <img width="20" src="./images/decorate_flower.png" alt="">
        </div>
        <div class="decorate_flower--three" style="--t: 3.3s;">
            <img width="20" src="./images/decorate_flower.png" alt="">
        </div>
        <div class="decorate_bottom">
            <img src="./images/decorate.png" alt="" width="100">
        </div>
        <div class="smiley__icon">
            <img src="./images/smiley_icon.png" alt="" width="100">
        </div>
    </div>

    <canvas id="confetti"></canvas>
</body>

<script>
    /* 20 August, 12:00 AM. Built from local parts so it fires at midnight
       on her own clock, whatever timezone she opens this in. */
    var TARGET = new Date(2026, 7, 20, 0, 0, 0);

    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var cells = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds")
    };
    var countdown = document.getElementById("countdown");
    var subtitle = document.getElementById("subtitle__text");
    var lockNote = document.getElementById("lock__note");
    var unlock = document.getElementById("unlock");
    var ticker;
    var unlocked = false;

    /* "Not Yet" is a lie once the clock runs out — rewrite the top line. */
    function setTitleLine(text) {
        var line = document.getElementById("line__one");
        line.textContent = "";
        for (var i = 0; i < text.length; i++) {
            var span = document.createElement("span");
            if (text[i] === " ") {
                span.className = "space";
            } else {
                span.textContent = text[i];
            }
            line.appendChild(span);
        }
    }

    function pad(n) {
        return n < 10 ? "0" + n : String(n);
    }

    function setCell(cell, value) {
        if (cell.textContent === value) return;
        cell.textContent = value;
        cell.classList.remove("pop");
        void cell.offsetWidth;   // restart the animation
        cell.classList.add("pop");
    }

    function openGate(withConfetti) {
        if (unlocked) return;
        unlocked = true;
        clearInterval(ticker);
        setCell(cells.days, "00");
        setCell(cells.hours, "00");
        setCell(cells.minutes, "00");
        setCell(cells.seconds, "00");
        setTitleLine("It's Time");
        subtitle.innerHTML = "It's time, madam ji &#10024;";
        lockNote.classList.add("hidden");
        countdown.classList.add("celebrating");
        unlock.classList.add("is-live");
        // Snap the staged intro animations to their finished state. Matters when
        // the page is opened at/after the target (or in the last seconds before
        // it) and they never got to run; a no-op once they already have.
        document.getElementById("gate-wrapper").classList.add("gate--open");
        if (withConfetti && !reduceMotion) startConfetti();
    }

    function tick() {
        var diff = TARGET - new Date();
        if (diff <= 0) {
            openGate(true);
            return;
        }
        var totalSeconds = Math.floor(diff / 1000);
        setCell(cells.days, pad(Math.floor(totalSeconds / 86400)));
        setCell(cells.hours, pad(Math.floor(totalSeconds / 3600) % 24));
        setCell(cells.minutes, pad(Math.floor(totalSeconds / 60) % 60));
        setCell(cells.seconds, pad(totalSeconds % 60));
    }

    if (TARGET - new Date() <= 0) {
        openGate(false);            // already past — land straight in the unlocked state
    } else {
        tick();                     // paint once so there is no blank first second
        ticker = setInterval(tick, 1000);
    }

    /* ---------- confetti ---------- */
    function startConfetti() {
        var canvas = document.getElementById("confetti");
        var ctx = canvas.getContext("2d");
        var colors = ["#A78BFA", "#ffffff", "#333333", "#F3EEFE"];
        var pieces = [];

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        for (var i = 0; i < 160; i++) {
            pieces.push({
                x: Math.random() * canvas.width,
                y: -20 - Math.random() * canvas.height,
                w: 6 + Math.random() * 7,
                h: 9 + Math.random() * 9,
                vx: -1.5 + Math.random() * 3,
                vy: 2 + Math.random() * 3.5,
                rot: Math.random() * Math.PI * 2,
                vr: -0.12 + Math.random() * 0.24,
                color: colors[Math.floor(Math.random() * colors.length)]
            });
        }

        (function frame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            var alive = 0;
            for (var i = 0; i < pieces.length; i++) {
                var p = pieces[i];
                p.x += p.vx;
                p.y += p.vy;
                p.rot += p.vr;
                if (p.y < canvas.height + 40) alive++;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
            }
            if (alive > 0) {
                requestAnimationFrame(frame);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        })();
    }
</script>

</html>
